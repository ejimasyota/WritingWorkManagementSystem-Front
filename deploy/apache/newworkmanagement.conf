<VirtualHost *:80>
    ServerName 172.21.127.7

    # Nuxtのソースを静的配信しない。画面は起動済みのNuxtへ転送する。
    DocumentRoot /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Front/public
    ProxyRequests Off
    ProxyPreserveHost On

    # Viteの仮想モジュールURLに含まれる%2Fを拒否・復号しない。
    AllowEncodedSlashes NoDecode

    # 除外設定は / のProxyPassより前に置く。
    # PHP APIはApacheで実行し、Nuxtへ転送しない。
    ProxyPass /Back/Api/ !
    ProxyPass /Uploads/ !

    Alias /Back/Api/ /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Back/Api/
    <Directory /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Back/Api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /Uploads/ /var/www/html/NewWorkManagement/Uploads/
    <Directory /var/www/html/NewWorkManagement/Uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Nuxt/Viteの開発用モジュールURLを、そのまま転送する。
    # 全体の / より前に置き、%2Fを含む仮想モジュールIDを保持する。
    ProxyPass /_nuxt/ http://127.0.0.1:3000/_nuxt/ nocanon upgrade=websocket
    ProxyPassReverse /_nuxt/ http://127.0.0.1:3000/_nuxt/

    # Apache 2.4.47以降。通常のHTTPと開発時のWebSocket(HMR)を転送する。
    ProxyPass / http://127.0.0.1:3000/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/newworkmanagement_error.log
    CustomLog ${APACHE_LOG_DIR}/newworkmanagement_access.log combined
</VirtualHost>
