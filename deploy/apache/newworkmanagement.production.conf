<VirtualHost *:80>
    # 本番のドメイン名に置き換える。HTTPSを使う場合は既存の443番VirtualHostへ同じ設定を入れる。
    ServerName example.com

    # npm run generate の生成物だけを静的配信する。
    DocumentRoot /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Front/.output/public
    DirectoryIndex index.html

    <Directory /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Front/.output/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /200.html
    </Directory>

    # 存在しないJS/CSSをSPA用HTMLに置き換えない。
    <Directory /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Front/.output/public/_nuxt>
        FallbackResource disabled
    </Directory>

    # APIとアップロードファイルは、静的フロントと同じオリジンで公開する。
    Alias /Back/Api/ /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Back/Api/
    <Directory /var/www/html/NewWorkManagement/WritingWorkManagementSystem-Back/Api>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource disabled
    </Directory>

    Alias /Uploads/ /var/www/html/NewWorkManagement/Uploads/
    <Directory /var/www/html/NewWorkManagement/Uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/newworkmanagement_error.log
    CustomLog ${APACHE_LOG_DIR}/newworkmanagement_access.log combined
</VirtualHost>
