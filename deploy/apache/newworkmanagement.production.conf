# 本番専用。生成した .output の中身を /var/www/Front に配置する。
# 既存資料のバックエンド・Uploads配置と、Let's Encrypt証明書を引き継ぐ。
<VirtualHost *:80>
    ServerName workmanagement.jp
    ServerAlias www.workmanagement.jp
    Redirect permanent / https://workmanagement.jp/
    ErrorLog ${APACHE_LOG_DIR}/newworkmanagement_error.log
    CustomLog ${APACHE_LOG_DIR}/newworkmanagement_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName workmanagement.jp
    ServerAlias www.workmanagement.jp
    DocumentRoot /var/www/Front/public
    DirectoryIndex index.html

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/workmanagement.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/workmanagement.jp/privkey.pem

    <Directory /var/www/Front>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/Front/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource /200.html
    </Directory>
    # 存在しない静的ファイルにはHTMLを返さず、404を返す。
    <Directory /var/www/Front/public/_nuxt>
        FallbackResource disabled
    </Directory>
    <Directory /var/www/Front/public/images>
        FallbackResource disabled
    </Directory>

    Alias /Back/Api/ /var/www/NewWorkManagment/Back/Api/
    <Directory /var/www/NewWorkManagment/Back>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/NewWorkManagment/Back/Api>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource disabled
    </Directory>

    Alias /Uploads/ /var/www/NewWorkManagment/Uploads/
    <Directory /var/www/NewWorkManagment/Uploads>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        FallbackResource disabled
        <FilesMatch "\.(?i:php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/newworkmanagement_error.log
    CustomLog ${APACHE_LOG_DIR}/newworkmanagement_access.log combined
</VirtualHost>
